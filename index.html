<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дом барнхаус — 3D-проход</title>
<meta name="description" content="Прогулка по дому барнхаус: прокрутите страницу, и камера пройдёт от крыльца до ванной второго этажа.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="view" aria-label="Вид из камеры, движется при прокрутке"></canvas>

<div class="frame" aria-hidden="true"></div>

<header class="top">
  <a class="logo" href="#" data-go="0">Дом барнхаус</a>
  <nav class="menu" aria-label="Разделы">
    <button data-panel="rooms">Комнаты</button><span>·</span>
    <button data-panel="materials">Материалы</button><span>·</span>
    <button data-panel="smeta">Смета</button><span>·</span>
    <button data-go="0" class="on">3D-проход</button>
  </nav>
</header>

<div class="room-card" id="roomCard" aria-live="polite">
  <div class="room-id" id="roomId"></div>
  <div class="room-name" id="roomName"></div>
  <div class="room-area" id="roomArea"></div>
</div>

<footer class="bottom">
  <div class="floors" role="group" aria-label="Этажи">
    <button data-floor="1" class="on">Этаж 1</button><span>/</span><button data-floor="2">Этаж 2</button>
  </div>
  <div class="hint" id="hint">Прокручивайте, чтобы идти по дому</div>
  <div class="progress"><i id="bar"></i></div>
</footer>

<aside class="panel" id="panel" hidden>
  <button class="close" id="closePanel" aria-label="Закрыть">×</button>
  <div class="panel-body" id="panelBody"></div>
</aside>

<div class="loader" id="loader">
  <div class="loader-title">Дом барнхаус</div>
  <div class="loader-pct" id="pct">0%</div>
  <div class="loader-bar"><i id="lbar"></i></div>
  <div class="loader-note">Загружаем кадры прохода</div>
</div>

<div id="scroll" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="app.js"></script>
</body>
</html>
